# Reliafy's content calendar (#343, #344), machine-readable.
#
# Read by the monthly drafting job (.github/workflows/content-draft.yml, which
# follows .github/content/draft-prompt.md): on the 15th it drafts every slot of
# the next month, plus a short LinkedIn post for each of that month's other
# weekdays and its evergreen pages.
# backend/tests/test_content_calendar.py checks this file parses and stays in
# shape.
#
# Every slot is a Monday. A post goes live at 10:00 Brisbane (00:00 UTC) on
# its date: the site, the sitemap and the LinkedIn feed all gate on the date.
# A whatsnew slot is the month's only email: its update is drafted with
# `send: auto`, so merging it approves the send (test copy the Friday before,
# the list at 10:00 Brisbane on the day).

timezone: Australia/Brisbane
publish_time: "10:00"

# The monthly template (#343): week 1 What's new, week 2 technical, week 3
# commentary, week 4 tutorial or case study.
types:
  whatsnew: "What's new: the month's post and its only email (retention)"
  technical: "Technical deep-dive: methods, worked examples, the statistics (credibility and search)"
  commentary: "Industry commentary: standards, incidents, RCM practice, AI in maintenance (voice)"
  tutorial: "Tutorial or case study: how to do X in Reliafy (conversion)"

# Besides the slots, every month.
cadence:
  # One LinkedIn post every weekday (Mon-Fri), never two on one day. A blog
  # post or What's new is its date's post (its linkedin: announcement); every
  # other weekday gets one short post (content/social/), about 20 a month.
  posts_per_weekday: 1
  evergreen_pages_per_month: [1, 2] # Learn / Reference pages

# The week of 28 Dec 2026 has no slot.
skipped_weeks:
  - "2026-12-28"

# "to be chosen": the drafting job proposes a topic in the PR.
