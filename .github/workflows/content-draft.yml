name: Content draft

# Drafts next month's content (#367): Claude Code, run headless by Anthropic's
# official action, follows .github/content/draft-prompt.md. It reads the
# calendar (.github/content/calendar.yml) and what shipped since the last
# What's new, drafts every slot of the month plus its short LinkedIn posts and
# evergreen pages, and the workflow opens ONE pull request, "Content for
# <Month>". Merging that pull request is the approval. See
# ops/content-pipeline.md.
#
# Needs the repository secret ANTHROPIC_API_KEY. Claude only writes files: it
# has no git push, no gh, and no network tools; this workflow checks the
# files, commits them and opens the pull request.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to draft, YYYY-MM (empty: next month)"
        required: false
        default: ""
  schedule:
    - cron: "0 22 14 * *" # 08:00 Brisbane on the 15th (22:00 UTC on the 14th)

permissions: {}

concurrency:
  group: content-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Push the branch and open the pull request; read issues for "what shipped".
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      # Third-party actions are pinned to commit SHAs, as in ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # No token in .git/config: Claude can't push. The last step pushes
          # with an explicit token.
          persist-credentials: false

      - name: Work out the month and branch
        id: month
        env:
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH_INPUT" ]; then
            month="$MONTH_INPUT"
          else
            month=$(date -u -d "$(date -u +%Y-%m-15) +1 month" +%Y-%m)
          fi
          if ! printf '%s' "$month" | grep -Eq '^[0-9]{4}-(0[1-9]|1[0-2])$'; then
            echo "::error::month must be YYYY-MM, got '$month'"
            exit 1
          fi
          {
            echo "month=$month"
            echo "label=$(date -u -d "$month-01" '+%B %Y')"
            echo "branch=content/$month"
            echo "today=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if this month's pull request is already open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.month.outputs.branch }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
          if [ "$n" != "0" ]; then
            echo "A pull request for $BRANCH is already open; not drafting again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Merged PRs and closed issues since the last What's new, by the
      # project's own maintainers only (a public repo's issues can be written
      # by anyone, and they reach the prompt).
      - name: Gather what shipped
        if: steps.open.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          since=$(ls frontend/src/content/updates/ | grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' \
            | awk -v t="$today" '$0 <= t' | sort | tail -1)
          since=${since:-$(date -u -d '-45 days' +%F)}
          echo "Since the last What's new: $since"
          trusted='select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")'
          shape='{number, title, url: .html_url, author: .user.login, closed_at, labels: [.labels[].name], body: ((.body // "")[0:4000])}'
          gh api --paginate -X GET search/issues \
            -f q="repo:$GITHUB_REPOSITORY is:pr is:merged merged:>=$since" -f per_page=100 \
            --jq ".items[] | $trusted | $shape + {kind: \"pr\"}" > "$RUNNER_TEMP/prs.jsonl"
          gh api --paginate -X GET search/issues \
            -f q="repo:$GITHUB_REPOSITORY is:issue is:closed reason:completed closed:>=$since" -f per_page=100 \
            --jq ".items[] | $trusted | $shape + {kind: \"issue\"}" > "$RUNNER_TEMP/issues.jsonl"
          # The base branch of each merged PR: main is live, dev ships next.
          : > "$RUNNER_TEMP/prs-based.jsonl"
          while IFS= read -r line; do
            n=$(printf '%s' "$line" | jq -r .number)
            base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .base.ref)
            printf '%s' "$line" | jq -c --arg base "$base" '. + {base: $base}' >> "$RUNNER_TEMP/prs-based.jsonl"
          done < "$RUNNER_TEMP/prs.jsonl"
          jq -s --arg since "$since" '{since: $since, items: .}' \
            "$RUNNER_TEMP/prs-based.jsonl" "$RUNNER_TEMP/issues.jsonl" > "$RUNNER_TEMP/shipped.json"
          jq '.items | group_by(.kind) | map({(.[0].kind): length}) | add' "$RUNNER_TEMP/shipped.json"

      # Versions of SurPyval and RePyability (the open-source libraries
      # Reliafy is built on) released in the last 45 days: GitHub Releases,
      # and tags with no Release (SurPyval's older releases were tags only),
      # each with where its release notes are. Claude announces each one not
      # already in frontend/src/content/social/ with a short post.
      - name: Gather library releases
        if: steps.open.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '-45 days' +%FT%TZ)
          out="$RUNNER_TEMP/releases.jsonl"
          : > "$out"
          for repo in derrynknife/SurPyval derrynknife/RePyability; do
            case "$repo" in
              */SurPyval) changelog=https://surpyval.readthedocs.io/en/latest/changelog.html ;;
              *) changelog=https://github.com/derrynknife/RePyability/blob/master/CHANGELOG.md ;;
            esac
            gh api "repos/$repo/releases?per_page=30" > "$RUNNER_TEMP/rel.json"
            jq -c --arg lib "${repo#*/}" --arg cutoff "$cutoff" '.[]
              | select((.draft | not) and (.prerelease | not) and .published_at >= $cutoff)
              | {library: $lib, tag: .tag_name, date: .published_at[0:10],
                 notes_url: .html_url, notes: ((.body // "")[0:4000])}' "$RUNNER_TEMP/rel.json" >> "$out"
            for tag in $(gh api "repos/$repo/tags?per_page=10" --jq '.[].name'); do
              jq -e --arg t "$tag" 'any(.[]; .tag_name == $t)' "$RUNNER_TEMP/rel.json" > /dev/null && continue
              when=$(gh api "repos/$repo/commits/$tag" --jq .commit.committer.date)
              [[ "$when" < "$cutoff" ]] && continue
              jq -nc --arg lib "${repo#*/}" --arg tag "$tag" --arg date "${when:0:10}" --arg url "$changelog" \
                '{library: $lib, tag: $tag, date: $date, notes_url: $url, notes: ""}' >> "$out"
            done
          done
          jq -s --arg since "${cutoff:0:10}" '{since: $since, releases: .}' "$out" > "$RUNNER_TEMP/library-releases.json"
          jq -c '.releases[] | {library, tag, date}' "$RUNNER_TEMP/library-releases.json"

      # For checking figures against the tests (python -m pytest).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.open.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - if: steps.open.outputs.skip != 'true'
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps "firebase-admin==7.7.0"
          pip install pytest
          pip install --no-deps "git+https://github.com/derrynknife/RePyability.git@debbb6ff2928034e273b609db9b09901cf6e6119"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.open.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: Draft the month with Claude Code
        if: steps.open.outputs.skip != 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the instructions in .github/content/draft-prompt.md exactly.

            TARGET_MONTH=${{ steps.month.outputs.month }}
            TODAY=${{ steps.month.outputs.today }}
            SHIPPED_FILE=${{ runner.temp }}/shipped.json
            RELEASES_FILE=${{ runner.temp }}/library-releases.json
            PR_BODY_FILE=${{ runner.temp }}/content-pr-body.md
          # The temp dir holds SHIPPED_FILE, RELEASES_FILE and PR_BODY_FILE.
          claude_args: |
            --max-turns 250
            --add-dir ${{ runner.temp }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(python -m pytest:*),Bash(node --test:*)"

      - name: Check the drafts
        if: steps.open.outputs.skip != 'true'
        run: |
          # Only content may change.
          outside=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v '^frontend/src/content/' || true)
          if [ -n "$outside" ]; then
            echo "::error::The draft changed files outside frontend/src/content/:"
            echo "$outside"
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all frontend/src/content)" ]; then
            echo "::error::No content was drafted."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/content-pr-body.md" ]; then
            echo "::error::No pull request description was written."
            exit 1
          fi
          (cd frontend && node --test src/contentFeed.test.js)
          python -m pytest backend/tests/test_content_calendar.py -q

      - name: Open the pull request
        if: steps.open.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.month.outputs.branch }}
          LABEL: ${{ steps.month.outputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add frontend/src/content
          git commit -m "Content for $LABEL (drafted)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "Content for $LABEL" --body-file "$RUNNER_TEMP/content-pr-body.md"
