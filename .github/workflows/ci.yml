name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Third-party actions are pinned to commit SHAs (the version tag each was
# resolved from is in the comment). The jobs only read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # RePyability isn't in requirements.txt: like the Dockerfile, install the
      # pinned tag --no-deps so it can't re-resolve surpyval from PyPI.
      - run: pip install --no-deps "git+https://github.com/derrynknife/RePyability.git@v0.12"
      - run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test src/csv.test.js
      - run: npm run build
