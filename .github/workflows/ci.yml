name: CI

# Runs only on the dev -> main release PR: the gate release.sh waits for before
# merging and deploying. Not on PRs into dev or on pushes (main gets exactly
# what its release PR tested); tests otherwise run locally on request.
on:
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs (the version tag each was
# resolved from is in the comment). The jobs only read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps "firebase-admin==7.7.0" && pip install pytest==9.1.1 pytest-xdist==3.8.0
      # RePyability isn't in requirements.txt: like the Dockerfile, install the
      # pinned commit (v0.15) --no-deps so it can't re-resolve surpyval from PyPI.
      - run: pip install --no-deps "git+https://github.com/derrynknife/RePyability.git@af15a3eccd4806cafed95a0c8fa9b0d1ebcc4010"
      # The slowest tests are listed, so a slower run says where the time went.
      - run: pytest backend/tests -n auto --dist loadfile --durations=40

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test "src/**/*.test.js"
      - run: npm run build

  # Browser smoke tests (#123): every page of an auth-disabled build, served by
  # the backend with the samples seeded, opens and draws; RBD imports, a fit and
  # an RBD calculation run end to end (frontend/smoke, `npm run smoke`).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      # The backend's packages as the backend job (and the Dockerfile) install them.
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps "firebase-admin==7.7.0"
      - run: pip install --no-deps "git+https://github.com/derrynknife/RePyability.git@af15a3eccd4806cafed95a0c8fa9b0d1ebcc4010"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - run: npm run smoke
        working-directory: frontend
        env:
          SMOKE_PYTHON: python
      # The report (screenshots and traces of each failure): download the
      # artifact, then `npx playwright show-report <folder>/playwright-report`.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
