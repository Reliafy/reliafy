name: CI

# A PR's run is the gate (release.sh waits for it); main's run records what was
# released. Not run again on the push to dev or on the dev -> main release PR,
# which carry the same code.
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [main]

# Third-party actions are pinned to commit SHAs (the version tag each was
# resolved from is in the comment). The jobs only read the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps "firebase-admin==7.7.0" && pip install pytest
      # RePyability isn't in requirements.txt: like the Dockerfile, install the
      # pinned commit (v0.13) --no-deps so it can't re-resolve surpyval from PyPI.
      - run: pip install --no-deps "git+https://github.com/derrynknife/RePyability.git@debbb6ff2928034e273b609db9b09901cf6e6119"
      # The slowest tests are listed, so a slower run says where the time went.
      - run: pytest backend/tests --durations=40

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test "src/**/*.test.js"
      - run: npm run build
